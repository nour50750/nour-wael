name: Publish Nour Wael Portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify and unpack complete portfolio
        run: |
          echo "29ac7d2224fc6cd9fcc000d064118972a98fbe3741c0b788f2826e91d5f4a701  nour-portfolio-nov15.zip" | sha256sum --check
          unzip -q -o nour-portfolio-nov15.zip -d release
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v4
        with:
          path: release/site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
